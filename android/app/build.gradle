plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.retropunk.mldforwarder'
    compileSdk 35

    defaultConfig {
        applicationId 'com.retropunk.mldforwarder'
        minSdk 24
        targetSdk 35
        versionCode 9
        versionName '1.1.4'

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.redesign'
            versionNameSuffix '.debug'
            resValue 'string', 'app_name', 'MLDForwarder Preview'
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

chaquopy {
    defaultConfig {
        version = '3.11'
        pip {
            options '--extra-index-url', 'https://www.piwheels.org/simple'
            install 'telethon==1.40.0'
        }
    }
}
