name: Build Windows v3.0.1

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Download verified tdl engine
        shell: cmd
        run: download_tdl.bat ^< nul

      - name: Build portable package
        shell: cmd
        run: build_exe.bat ^< nul

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: cmd
        run: build_installer.bat ^< nul

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: MLDTools_v3.0.1_Windows
          path: |
            release/MLDTools_Portable.zip
            release/installer/MLDTools_Setup_v3.0.1.exe
          if-no-files-found: error
          retention-days: 7
