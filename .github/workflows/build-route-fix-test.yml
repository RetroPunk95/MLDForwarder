name: Build Windows test

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Download verified tdl engine
        shell: cmd
        run: download_tdl.bat ^< nul

      - name: Build portable package
        shell: cmd
        run: build_exe.bat ^< nul

      - name: Upload portable package
        uses: actions/upload-artifact@v4
        with:
          name: MLDTools_Portable_route-fix
          path: release/MLDTools_Portable.zip
          if-no-files-found: error
          retention-days: 7
