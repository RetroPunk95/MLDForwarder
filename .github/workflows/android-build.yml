name: Android stable build

on:
  workflow_dispatch:
  push:
    branches:
      - android-stable
    paths:
      - "android/app/**"
      - "android/build.gradle"
      - "android/settings.gradle"
      - "android/gradle.properties"
      - ".github/workflows/android-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build unsigned release APK
        working-directory: android
        run: gradle :app:assembleRelease --stacktrace

      - name: Collect official APK signing tool
        shell: bash
        run: |
          apksig_jar=$(find "$HOME/.gradle/caches/modules-2/files-2.1/com.android.tools.build/apksig/8.9.2" -name 'apksig-8.9.2.jar' -type f -print -quit)
          test -n "$apksig_jar"
          cp "$apksig_jar" android/app/build/outputs/apk/release/apksig.jar

      - name: Upload unsigned release bundle
        uses: actions/upload-artifact@v4
        with:
          name: MLDForwarder-Android-stable-unsigned
          path: |
            android/app/build/outputs/apk/release/app-release-unsigned.apk
            android/app/build/outputs/apk/release/apksig.jar
          if-no-files-found: error
          retention-days: 1
